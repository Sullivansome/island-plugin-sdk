[workspace]
resolver = "2"
members = ["crates/island-plugin-api", "crates/island-plugin-sdk", "crates/island-design"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Sullivansome/island-plugin-sdk"

[workspace.dependencies]
island-design = { path = "crates/island-design" }
island-plugin-api = { path = "crates/island-plugin-api" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
